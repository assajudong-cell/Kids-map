<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="키즈존 300 지도">
<meta property="og:description" content="아이와 가볼 만한 국내 여행지 300곳을 테마별로 보는 지도">
<title>키즈존 300 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: 왼쪽 안내·필터·목록 패널 + 오른쪽 지도. 폰에서는 지도 위, 목록 아래. */
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#24302b; --muted:#6b756f; --line:#e3ded2;
  --sea:#b9d6ee; --land:#f7f6f1; --land-edge:#9fb6c9; --other:#e9e7e1; --border:#b7a9cf; --lbl:#5c6670; --lbl-halo:#ffffff; --prov-lbl:#9a8fb3;
  --accent:#1f6f5c; --chip:#f0ece2;
  --f-display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191a; --panel:#1c2224; --ink:#e7ece8; --muted:#9aa5a0; --line:#2e3739;
  --sea:#152634; --land:#262c2f; --land-edge:#3d5366; --other:#1d2124; --border:#5d5577; --lbl:#b7c0c6; --lbl-halo:#15191a; --prov-lbl:#8a80a6;
  --accent:#62c3a6; --chip:#263033; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191a; --panel:#1c2224; --ink:#e7ece8; --muted:#9aa5a0; --line:#2e3739;
  --sea:#152634; --land:#262c2f; --land-edge:#3d5366; --other:#1d2124; --border:#5d5577; --lbl:#b7c0c6; --lbl-halo:#15191a; --prov-lbl:#8a80a6;
  --accent:#62c3a6; --chip:#263033; color-scheme:dark}
html,body{height:100%}
body{margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.head{padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:2px 0 0;text-wrap:balance;font-weight:400}
.sub{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.search{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.search:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.tools{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.list{overflow:auto;flex:1;min-height:0;padding:6px 0 16px}
.zone-h{position:sticky;top:0;background:var(--panel);padding:10px 16px 6px max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);z-index:1}
.zone-h b{color:var(--ink);font-weight:700;font-family:var(--f-display);font-size:14px}
.item{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 16px 8px max(16px,env(safe-area-inset-left,0px));border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.item:hover,.item.on{background:var(--chip)}
.num{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.nm{min-width:0}
.nm strong{display:block;font-weight:500;line-height:1.35}
.nm span{font-size:11.5px;color:var(--muted)}
.tag{width:10px;height:10px;border-radius:50%;background:var(--c)}
.empty{padding:24px 16px;color:var(--muted)}
.mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.pop .t{font-family:var(--f-display);font-size:17px;line-height:1.3;margin:2px 0 4px}
.pop .m{color:var(--muted);font-size:12px;line-height:1.6}
.pop .badge{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip)}
.pop .badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pop .warn{font-size:11px;color:var(--muted);margin-top:6px}
.pop .links{display:flex;gap:6px;margin-top:10px}
.pop .links a{flex:1;text-align:center;padding:6px 8px;border-radius:8px;background:var(--accent);color:var(--panel);text-decoration:none;font-size:12px;font-weight:500}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.lbl{white-space:nowrap;font-size:12px;color:var(--lbl);font-weight:500;text-shadow:0 0 3px var(--lbl-halo),0 0 3px var(--lbl-halo),0 0 2px var(--lbl-halo);transform:translate(-50%,-50%);pointer-events:none;display:flex;align-items:center;gap:4px}
.lbl.big{font-size:13.5px;font-weight:700;color:var(--ink)}
.lbl.city::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lbl);box-shadow:0 0 0 1.5px var(--lbl-halo)}
.lbl.prov{font-size:15px;letter-spacing:.3em;color:var(--prov-lbl);font-weight:700}
.z7 .c2,.z8 .c2{display:none}
.z10 .prov,.z11 .prov,.z12 .prov,.z13 .prov,.z14 .prov,.z15 .prov,.z9 .prov{display:none}
.z6 .c2,.z6 .c1{display:none}
.credit{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;z-index:500;font-size:10px;color:var(--muted)}
.legend-note{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 52vh auto;height:auto}
  .side{display:contents}
  .head{order:1;background:var(--panel)}
  .mapwrap{order:2;height:52vh}
  .list{order:3;background:var(--panel);overflow:visible}
  .zone-h{top:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <div>
        <div class="eyebrow">KIDS ZONE · 국내 아이와 가볼 곳</div>
        <h1>키즈존 300 지도</h1>
        <p class="sub">가이드북 목차의 장소 300곳을 테마별로 지도에 표시했어요. 핀을 누르면 책 페이지와 길찾기 링크가 나옵니다.</p>
      </div>
      <input id="q" class="search" type="search" placeholder="장소·지역 검색 (예: 아쿠아, 가평, 펜션)" autocomplete="off">
      <div class="row">
        <select id="zone" aria-label="책의 권역"></select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="테마"></div>
      <div class="tools"><span><b class="count" id="cnt">300</b>곳 표시 중</span><button class="linkbtn" id="reset" type="button">필터 초기화</button></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="장소 지도"></div>
    <div class="legend-note">테두리 점선 핀은 대략 위치</div>
  </main>
</div>

  <div class="t">${pad(p.no)} · ${esc(p.name)}</div>
  <div class="m">${esc(p.sido)} ${esc(p.sgg)} · 권역: ${esc(p.zone)}<br>가이드북 <b>${p.page}쪽</b></div>
  ${p.exact?"":'<div class="warn">핀은 대략 위치예요. 정확한 위치는 아래 지도 앱에서 확인하세요.</div>'}
  <div class="links"><a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a><a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a></div></div>`;
}

const zoneSel=document.getElementById("zone");
zoneSel.innerHTML=`<option value="">전체 권역 (20)</option>`+zones.map((z,i)=>`<option value="${esc(z)}">${String(i+1).padStart(2,"0")} ${esc(z)}</option>`).join("");
zoneSel.value=state.zone;
const chips=document.getElementById("chips");
function renderChips(base){
  chips.innerHTML=Object.entries(THEMES).map(([k,v])=>{
    const n=base.filter(p=>p.t===k).length;
    return `<button type="button" class="chip" data-k="${k}" aria-pressed="${state.on.has(k)}" style="--c:${v.c}"><span class="dot"></span>${v.n}<span class="n">${n}</span></button>`}).join("");
}
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;
  if(e.altKey||e.metaKey){state.on=new Set([k])}
  else if(state.on.size===Object.keys(THEMES).length){state.on=new Set([k])}
  else if(state.on.has(k)){state.on.delete(k);if(!state.on.size)state.on=new Set(Object.keys(THEMES))}
  else state.on.add(k);
  update();
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();update()});
zoneSel.addEventListener("change",e=>{state.zone=e.target.value;update(true)});
document.getElementById("reset").addEventListener("click",()=>{state.q="";state.zone="";state.on=new Set(Object.keys(THEMES));document.getElementById("q").value="";zoneSel.value="";update(true)});

let active=null;
function mark(p){
  document.querySelectorAll(".item.on").forEach(x=>x.classList.remove("on"));
  const el=document.querySelector(`.item[data-no="${p.no}"]`);
  if(el){el.classList.add("on");if(!matchMedia("(max-width:760px)").matches)el.scrollIntoView({block:"nearest"})}
  active=p;
}
const list=document.getElementById("list");
list.addEventListener("click",e=>{
  const b=e.target.closest(".item");if(!b)return;
  const p=places.find(x=>x.no===+b.dataset.no);
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),12));p.m.openPopup();mark(p);
  if(matchMedia("(max-width:760px)").matches)document.querySelector(".mapwrap").scrollIntoView({behavior:"smooth"});
});
const layer=L.layerGroup().addTo(map);
function update(fit){
  const q=state.q.toLowerCase();
  const base=places.filter(p=>(!state.zone||p.zone===state.zone)&&(!q||`${p.name} ${p.sido} ${p.sgg} ${p.zone} ${THEMES[p.t].n} ${pad(p.no)}`.toLowerCase().includes(q)));
  const vis=base.filter(p=>state.on.has(p.t));
  renderChips(base);
  layer.clearLayers();vis.forEach(p=>layer.addLayer(p.m));
  document.getElementById("cnt").textContent=vis.length;
  let html="",cur=null;
  for(const p of vis){
    if(p.zone!==cur){cur=p.zone;const n=vis.filter(x=>x.zone===cur).length;html+=`<div class="zone-h"><b>${String(zones.indexOf(cur)+1).padStart(2,"0")} ${esc(cur)}</b><span>${n}곳</span></div>`}
    html+=`<button type="button" class="item" data-no="${p.no}"><span class="num">${pad(p.no)}</span><span class="nm"><strong>${esc(p.name)}</strong><span>${esc(p.sido)} ${esc(p.sgg)} · ${p.page}쪽</span></span><span class="tag" style="--c:${THEMES[p.t].c}" title="${THEMES[p.t].n}"></span></button>`;
  }
  list.innerHTML=html||`<div class="empty">조건에 맞는 장소가 없어요. 검색어를 지우거나 필터를 초기화해 보세요.</div>`;
  if(fit&&vis.length){map.fitBounds(L.latLngBounds(vis.map(p=>[p.lat,p.lng])).pad(.15),{maxZoom:11})}
  save();
}
update(true);
</script>
</body>
</html>
