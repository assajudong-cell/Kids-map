const ri=s=>{const i=ORDER.indexOf(s);return i<0?99:i};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const F={region:"",theme:""};

function countBy(arr,f){const m={};arr.forEach(p=>{const k=f(p);m[k]=(m[k]||0)+1});return m}
function chips(el,key,label,counts,order){
  const keys=Object.keys(counts).sort(order);
  el.innerHTML=`<button class="chip" type="button" data-v="" aria-pressed="${!F[key]}">${label}</button>`+
    keys.map(k=>`<button class="chip" type="button" data-v="${esc(k)}" aria-pressed="${F[key]===k}">${esc(k)}<small>${counts[k]}</small></button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;F[key]=b.dataset.v;render()};
}
function match(p,skip){
  const q=$("q").value.trim(),src=$("src").value;
  if(skip!=="region"&&F.region&&p.s!==F.region)return false;
  if(skip!=="theme"&&F.theme&&p.th!==F.theme)return false;
  if(src==="b"&&!p.b)return false; if(src==="n"&&p.b)return false;
  if($("onlyStar").checked&&!stars[p.k])return false;
  if(q){const hay=(p.n+" "+p.s+" "+p.g+" "+p.th+" "+p.tp.join(" "));if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function card(p){
  return `<article class="card"><div class="top"><div class="name">${esc(p.n)}</div>
   <button class="star" type="button" data-k="${esc(p.k)}" aria-pressed="${!!stars[p.k]}" aria-label="${esc(p.n)} 찜">★</button></div>
   <div class="where">${esc(p.s)} ${esc(p.g)}</div>
   <div class="tags"><span class="tag th">${esc(p.th)}</span>${p.b?`<span class="tag book">키즈존 300</span>`:""}${p.tp.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
   <div class="foot"><a class="btn" href="${url(p)}" target="_blank" rel="noopener">네이버 지도 열기</a></div></article>`;
}
function render(){
  chips($("regionChips"),"region","전국",countBy(P.filter(p=>match(p,"region")),p=>p.s),(a,b)=>ri(a)-ri(b));
  chips($("themeChips"),"theme","모든 테마",countBy(P.filter(p=>match(p,"theme")),p=>p.th),(a,b)=>a.localeCompare(b,"ko"));
  const rows=P.filter(p=>match(p));
  $("count").textContent=`${rows.length}곳`;
  if(!rows.length){$("out").innerHTML=`<p class="empty">조건에 맞는 장소가 없어요. 필터를 하나 풀어 보세요.</p>`;return}
  const groups={};rows.forEach(p=>(groups[p.s]=groups[p.s]||[]).push(p));
  $("out").innerHTML=Object.keys(groups).sort((a,b)=>ri(a)-ri(b)).map(s=>{
    const g=groups[s].sort((a,b)=>a.g.localeCompare(b.g,"ko")||a.n.localeCompare(b.n,"ko"));
    return `<section><h2>${esc(s)}<small>${g.length}곳</small></h2><div class="grid">${g.map(card).join("")}</div></section>`}).join("");
}
$("out").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const k=b.dataset.k;
  if(stars[k])delete stars[k];else stars[k]=1;saveStars();b.setAttribute("aria-pressed",!!stars[k]);if($("onlyStar").checked)render()});
$("q").addEventListener("input",render);["src","onlyStar"].forEach(id=>$(id).addEventListener("change",render));
(function(){const b=P.filter(p=>p.b).length,reg=new Set(P.map(p=>p.s)).size,th=new Set(P.map(p=>p.th)).size;
 $("stats").innerHTML=`<span><b>${P.length}</b>곳</span><span><b>${reg}</b>개 시도</span><span><b>${th}</b>개 테마</span><span><b>${b}</b>곳은 키즈존 300 책</span>`})();
render();
</script>
